name: The High Evolutionary Review

on:
  workflow_dispatch:
    inputs:
      review_type:
        description: 'Type of review to run'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick
          - security-only
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  high-evolutionary-review:
    name: Run The High Evolutionary Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --frozen-lockfile || npm ci || npm install
        continue-on-error: true

      - name: Run The High Evolutionary Review
        id: review
        run: |
          echo "🔮 Initiating The High Evolutionary's analysis..."
          npm run high-evolutionary:review > review_output.txt 2>&1 || true
          cat review_output.txt

      - name: Update Progress Tracking
        run: |
          echo "📊 Updating progress tracking..."
          npm run high-evolutionary:progress || true

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code tobefixed.md || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "The High Evolutionary [bot]"
          git add tobefixed.md
          git commit -m "chore: Update tobefixed.md from High Evolutionary review [skip ci]"
          git push

      - name: Create Issue with Findings
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            // Read the review output
            let reviewOutput = '';
            try {
              reviewOutput = fs.readFileSync('review_output.txt', 'utf8');
            } catch (error) {
              reviewOutput = 'Unable to read review output';
            }
            
            // Create issue with review findings
            const issueTitle = `🔮 The High Evolutionary Review - ${new Date().toISOString().split('T')[0]}`;
            const issueBody = `# The High Evolutionary's Assessment

**Automated Code Review Report**

Generated on: ${new Date().toISOString()}

## Review Output

\`\`\`
${reviewOutput.slice(0, 60000)}
\`\`\`

${reviewOutput.length > 60000 ? '\n*(Output truncated due to length)*\n' : ''}

## Next Steps

1. Review the findings above
2. Check \`tobefixed.md\` for detailed progress tracking
3. Address critical and high-priority issues first
4. Run \`npm run high-evolutionary:progress\` to update tracking

---

*"The Construct must be perfect. Do not fail me, Apprentice."*
`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              labels: ['code-review', 'automated', 'high-evolutionary']
            });

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: high-evolutionary-review
          path: review_output.txt
          retention-days: 30

      - name: Job Summary
        if: always()
        run: |
          echo "# 🔮 The High Evolutionary Review Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review completed at $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f review_output.txt ]; then
            echo "## Summary" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            tail -n 50 review_output.txt >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the artifacts for full review output." >> $GITHUB_STEP_SUMMARY
